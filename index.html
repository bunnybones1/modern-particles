<canvas id="canvas" aria-label="40,000 glowing fireflies drifting in three dimensions"></canvas>
<header><a class="brand" href="/" aria-label="Fireflies home">FIREFLIES<span class="brand-dot"></span></a><div class="top-meta">AN EXPERIMENT IN MOTION<span>RUST / WASM / WEBGPU</span></div><button id="fullscreen" class="icon-button" aria-label="Enter fullscreen" title="Fullscreen">⛶</button></header>
<main><div class="caption"><span class="eyebrow">A FIELD OF LITTLE LIGHTS</span><h1>The night<br/>is alive.</h1><p>40,000 fireflies in a three-dimensional field.<br/>Move your pointer. Stir the current.</p></div></main>
<footer><div class="status"><i></i><span id="status">INITIALIZING</span><span class="divider">/</span><span id="fps">— FPS</span></div><div class="controls"><button id="pause" aria-label="Pause simulation">Pause <span>Ⅱ</span></button><button id="reset" aria-label="Reseed particles">Reseed <span>↗</span></button><button id="settings" aria-expanded="false" aria-controls="panel">Tune <span>≋</span></button></div><span class="edition">NO. 001 — AFTER DARK</span></footer>
<section id="panel" hidden aria-label="Flow settings"><label>Flow speed <output id="speed-value">1.0×</output><input id="speed" type="range" min="0.2" max="2" step="0.1" value="1"/></label><label>Turbulence <output id="turbulence-value">0.7</output><input id="turbulence" type="range" min="0.2" max="1.5" step="0.1" value="0.7"/></label><label>Color current<select id="palette"><option value="0">Field hues</option><option value="1">Ember</option><option value="2">Moonlight</option></select></label><p>Space to pause · R to reseed · H to hide UI</p></section>
<div id="error" hidden role="alert"><h2>A little more GPU, please.</h2><p id="error-message"></p><button onclick="location.reload()">Try again</button></div>
